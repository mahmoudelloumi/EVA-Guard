<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#24427a"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect width="1000" height="660" fill="#ffffff"/>

  <!-- Couche 1 : réseau Ethereum -->
  <rect x="20" y="20" width="960" height="135" rx="10" fill="#eef3fb" stroke="#0b3d91" stroke-width="1.5"/>
  <text x="38" y="44" font-size="14" font-weight="700" fill="#0b3d91">① Réseau Ethereum privé (Docker, isolé)</text>
  <rect x="50" y="62" width="260" height="72" rx="8" fill="#e3f4e8" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="180" y="92" font-size="14" font-weight="700" fill="#1e6b41" text-anchor="middle">Nœuds honnêtes (4-5)</text>
  <text x="180" y="114" font-size="12" fill="#1e6b41" text-anchor="middle">+ signer + nœud référence</text>
  <rect x="370" y="62" width="260" height="72" rx="8" fill="#fff4d6" stroke="#c58a00" stroke-width="2"/>
  <text x="500" y="92" font-size="14" font-weight="700" fill="#8a6100" text-anchor="middle">Nœud VICTIME (Geth)</text>
  <text x="500" y="114" font-size="12" fill="#8a6100" text-anchor="middle">surveillé par EVA-Guard</text>
  <rect x="690" y="62" width="260" height="72" rx="8" fill="#fde4e4" stroke="#c0392b" stroke-width="1.5"/>
  <text x="820" y="92" font-size="14" font-weight="700" fill="#962d22" text-anchor="middle">Nœuds attaquants (6-10)</text>
  <text x="820" y="114" font-size="12" fill="#962d22" text-anchor="middle">Sybil · réseau séparé</text>
  <line x1="312" y1="98" x2="366" y2="98" stroke="#2e8b57" stroke-width="2.5"/>
  <text x="339" y="90" font-size="10" fill="#1e6b41" text-anchor="middle">P2P</text>
  <line x1="688" y1="98" x2="634" y2="98" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <text x="661" y="90" font-size="10" fill="#962d22" text-anchor="middle">attaque</text>

  <!-- flèches vers collecte -->
  <g stroke="#24427a" stroke-width="1.8" marker-end="url(#a)">
    <line x1="145" y1="157" x2="145" y2="196"/>
    <line x1="375" y1="157" x2="375" y2="196"/>
    <line x1="605" y1="157" x2="605" y2="196"/>
    <line x1="845" y1="157" x2="845" y2="196"/>
  </g>

  <!-- Couche 2 : collecte -->
  <rect x="20" y="200" width="960" height="125" rx="10" fill="#f4f7fc" stroke="#24427a" stroke-width="1.5"/>
  <text x="38" y="224" font-size="14" font-weight="700" fill="#24427a">② Collecte multi-source → Prometheus + dataset (fenêtres de 10 s)</text>
  <g font-size="13" text-anchor="middle">
    <rect x="40" y="238" width="210" height="70" rx="8" fill="#fff" stroke="#24427a"/>
    <text x="145" y="266" font-weight="700" fill="#24427a">Source P2P</text>
    <text x="145" y="288" font-size="11.5" fill="#3b4a66">métriques Geth, admin_peers</text>
    <rect x="270" y="238" width="210" height="70" rx="8" fill="#fff" stroke="#24427a"/>
    <text x="375" y="266" font-weight="700" fill="#24427a">Source Chaîne</text>
    <text x="375" y="288" font-size="11.5" fill="#3b4a66">hauteur, retard de sync</text>
    <rect x="500" y="238" width="210" height="70" rx="8" fill="#fff" stroke="#24427a"/>
    <text x="605" y="266" font-weight="700" fill="#24427a">Source Système</text>
    <text x="605" y="288" font-size="11.5" fill="#3b4a66">CPU, RAM, réseau (cAdvisor)</text>
    <rect x="730" y="238" width="230" height="70" rx="8" fill="#fff" stroke="#24427a"/>
    <text x="845" y="266" font-weight="700" fill="#24427a">Source RPC</text>
    <text x="845" y="288" font-size="11.5" fill="#3b4a66">proxy : req/s, latence, erreurs</text>
  </g>

  <!-- liens collecte -> agents -->
  <line x1="120" y1="327" x2="120" y2="401" stroke="#24427a" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="128" y="372" font-size="11" fill="#3b4a66">flux de métriques</text>
  <line x1="500" y1="331" x2="500" y2="401" stroke="#24427a" stroke-width="1.8" stroke-dasharray="5 4" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="508" y="372" font-size="11" fill="#3b4a66">requêtes de preuves</text>

  <!-- Couche 3 : agents -->
  <rect x="20" y="345" width="960" height="225" rx="10" fill="#ffffff" stroke="#0b3d91" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="38" y="345" dy="-0" font-size="0"> </text>
  <rect x="610" y="335" width="355" height="22" fill="#ffffff"/>
  <text x="962" y="351" font-size="14" font-weight="700" fill="#0b3d91" text-anchor="end">③ Système multi-agents (LangGraph)</text>

  <g text-anchor="middle">
    <rect x="40" y="405" width="160" height="80" rx="8" fill="#e8eefb" stroke="#0b3d91" stroke-width="1.5"/>
    <text x="120" y="432" font-size="13.5" font-weight="700" fill="#0b3d91">1. Détection</text>
    <text x="120" y="452" font-size="11.5" fill="#3b4a66">ML : Isolation Forest</text>
    <text x="120" y="469" font-size="11.5" fill="#3b4a66">+ XGBoost</text>

    <rect x="230" y="405" width="160" height="80" rx="8" fill="#e8eefb" stroke="#0b3d91" stroke-width="1.5"/>
    <text x="310" y="432" font-size="13.5" font-weight="700" fill="#0b3d91">2. Interprétation</text>
    <text x="310" y="452" font-size="11.5" fill="#3b4a66">LLM + RAG</text>
    <text x="310" y="469" font-size="11.5" fill="#3b4a66">→ hypothèse JSON</text>

    <rect x="420" y="405" width="160" height="80" rx="8" fill="#e8eefb" stroke="#0b3d91" stroke-width="1.5"/>
    <text x="500" y="432" font-size="13.5" font-weight="700" fill="#0b3d91">3. Corrélation</text>
    <text x="500" y="452" font-size="11.5" fill="#3b4a66">outils Python</text>
    <text x="500" y="469" font-size="11.5" fill="#3b4a66">mesurent les preuves</text>

    <rect x="610" y="405" width="160" height="80" rx="8" fill="#e8eefb" stroke="#0b3d91" stroke-width="2.5"/>
    <text x="690" y="432" font-size="13.5" font-weight="700" fill="#0b3d91">4. Confirmation</text>
    <text x="690" y="452" font-size="11.5" fill="#3b4a66">≥ 3 preuves</text>
    <text x="690" y="469" font-size="11.5" fill="#3b4a66">≥ 2 sources</text>

    <rect x="800" y="405" width="160" height="80" rx="8" fill="#e8eefb" stroke="#0b3d91" stroke-width="1.5"/>
    <text x="880" y="432" font-size="13.5" font-weight="700" fill="#0b3d91">5. Restitution</text>
    <text x="880" y="452" font-size="11.5" fill="#3b4a66">rapport</text>
    <text x="880" y="469" font-size="11.5" fill="#3b4a66">+ recommandation</text>
  </g>
  <g stroke="#24427a" stroke-width="1.8" marker-end="url(#a)">
    <line x1="200" y1="445" x2="228" y2="445"/>
    <line x1="390" y1="445" x2="418" y2="445"/>
    <line x1="580" y1="445" x2="608" y2="445"/>
    <line x1="770" y1="445" x2="798" y2="445"/>
  </g>
  <g font-size="10.5" fill="#3b4a66" text-anchor="middle" font-style="italic">
    <text x="215" y="500">alerte</text>
    <text x="405" y="500">hypothèse</text>
    <text x="595" y="500">preuves</text>
    <text x="785" y="500">décision</text>
  </g>

  <!-- base RAG -->
  <g>
    <path d="M255,515 v35 a55,9 0 0 0 110,0 v-35" fill="#f4f0ff" stroke="#6a4fb3" stroke-width="1.5"/>
    <ellipse cx="310" cy="515" rx="55" ry="9" fill="#ebe4ff" stroke="#6a4fb3" stroke-width="1.5"/>
    <text x="310" y="541" font-size="11.5" font-weight="700" fill="#4b3590" text-anchor="middle">Base RAG</text>
    <text x="310" y="556" font-size="10" fill="#4b3590" text-anchor="middle">docs Ethereum</text>
    <line x1="310" y1="505" x2="310" y2="489" stroke="#6a4fb3" stroke-width="1.5" marker-end="url(#a)"/>
  </g>

  <!-- décisions -->
  <rect x="615" y="512" width="150" height="22" rx="11" fill="#e3f4e8" stroke="#2e8b57"/>
  <text x="690" y="527" font-size="11" font-weight="700" fill="#1e6b41" text-anchor="middle">CONFIRMÉE</text>
  <rect x="615" y="539" width="150" height="22" rx="11" fill="#f1f2f4" stroke="#6b7280"/>
  <text x="690" y="554" font-size="11" font-weight="700" fill="#4b5563" text-anchor="middle">NON CONFIRMÉE</text>

  <!-- Dashboard -->
  <line x1="880" y1="487" x2="880" y2="596" stroke="#24427a" stroke-width="1.8" marker-end="url(#a)"/>
  <rect x="740" y="600" width="240" height="46" rx="8" fill="#0b3d91"/>
  <text x="860" y="621" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">④ Dashboard Streamlit</text>
  <text x="860" y="638" font-size="11" fill="#dbe4f5" text-anchor="middle">décision + preuves + explication</text>
</svg>
